# Release = push an update to every device. Push a tag like v0.2.6 and this:
#   1. checks the tag matches agent/Cargo.toml, installer/setup/Cargo.toml, installer/vitals.iss
#      and the app's versionName
#   2. builds the Windows agent + installers, the Linux agent (x86-64, ARM64) + .run installers,
#      and the Android APK (signed with the same key as every earlier APK)
#   3. publishes them as ONE GitHub Release (a normal release: agents read /releases/latest,
#      which ignores pre-releases), with SHA256SUMS
#   4. tells the Vitals backend (releases:publish). Every online agent installs it within about
#      a minute; the app shows "Update available" the next time it is opened.
#
# Repository secrets (gh secret set NAME < file):
#   CONVEX_URL               prod Convex URL, baked into the installers   (< installer/convex-url.txt)
#   CONVEX_DEPLOY_KEY        prod deploy key, to call releases:publish    (Convex dashboard > Settings)
#                            optional: without it, run the printed releases:publish command by hand
#   ANDROID_KEYSTORE_BASE64  the keystore that signed every earlier APK, base64-encoded
#                            (base64 -w0 ~/.android/debug.keystore | gh secret set ANDROID_KEYSTORE_BASE64)
#
# Deploy the backend (cd convex && npx convex deploy) before the first release that needs a new
# Convex function; this workflow only calls releases:publish, it never deploys.
name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write # create the release

jobs:
  versions:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - id: v
        name: Tag matches every version
        run: |
          version="${GITHUB_REF_NAME#v}"
          agent=$(sed -n 's/^version = "\(.*\)"/\1/p' agent/Cargo.toml | head -1)
          iss=$(sed -n 's/^#define AppVersion "\(.*\)"/\1/p' installer/vitals.iss | head -1)
          app=$(sed -n 's/^ *versionName = "\(.*\)"/\1/p' android/app/build.gradle.kts | head -1)
          setup=$(sed -n 's/^version = "\(.*\)"/\1/p' installer/setup/Cargo.toml | head -1)
          echo "tag=$version agent=$agent setup=$setup installer=$iss app=$app"
          for v in "$agent" "$setup" "$iss" "$app"; do
            [ "$v" = "$version" ] || { echo "::error::every version must be $version (agent/Cargo.toml, installer/setup/Cargo.toml, installer/vitals.iss, android versionName)"; exit 1; }
          done
          echo "version=$version" >> "$GITHUB_OUTPUT"
      # Fail here, before anything is built or published, not after the release is already live.
      - name: Secrets and repository are ready
        env:
          CONVEX_URL: ${{ secrets.CONVEX_URL }}
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          [ -n "$CONVEX_URL" ] || { echo "::error::Repository secret CONVEX_URL is not set"; exit 1; }
          [ -n "$CONVEX_DEPLOY_KEY" ] || echo "::warning::CONVEX_DEPLOY_KEY is not set: the release is published but not pushed; run releases:publish by hand (see the last step)"
          [ -n "$KEYSTORE" ] || { echo "::error::Repository secret ANDROID_KEYSTORE_BASE64 is not set"; exit 1; }
          # Agents, the app and releases:publish only trust downloads from theallmyti/Vitals.
          [ "$GITHUB_REPOSITORY" = "theallmyti/Vitals" ] || { echo "::error::rename the repository to theallmyti/Vitals first (it is $GITHUB_REPOSITORY)"; exit 1; }

  windows:
    needs: versions
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            agent
            installer/setup
      - name: Test and build agent
        working-directory: agent
        run: |
          cargo test --locked
          cargo build --release --locked

      - name: Convex URL from secret
        shell: pwsh
        env:
          CONVEX_URL: ${{ secrets.CONVEX_URL }}
        run: |
          if (-not $env:CONVEX_URL) { throw "Repository secret CONVEX_URL is not set" }
          Set-Content -Path installer/convex-url.txt -Value $env:CONVEX_URL -NoNewline -Encoding ascii

      - name: Fetch PawnIO (pinned, signature checked)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./installer/fetch-pawnio.ps1

      # The Rust installer (installer/setup) embeds the agent, the PawnIO files and the backend URL,
      # so it is built after all three. One exe is setup, manager and uninstaller: named
      # vitals-uninstall.exe it opens on the uninstall screen.
      - name: Test and build installer
        shell: pwsh
        working-directory: installer/setup
        env:
          VERSION: ${{ needs.versions.outputs.version }}
        run: |
          cargo test --locked
          if ($LASTEXITCODE -ne 0) { throw "installer tests failed" }
          cargo build --release --locked
          if ($LASTEXITCODE -ne 0) { throw "installer build failed" }
          $dist = "$env:GITHUB_WORKSPACE/dist"
          New-Item -ItemType Directory -Force $dist | Out-Null
          Get-ChildItem $dist | Remove-Item -Force
          $exe = "target/release/vitals-setup.exe"
          Copy-Item $exe "$dist/vitals-setup-$env:VERSION.exe"
          Copy-Item $exe "$dist/vitals-setup.exe"
          Copy-Item $exe "$dist/vitals-uninstall.exe"

      - name: Agent files
        shell: pwsh
        run: |
          Copy-Item agent/target/release/vitals.exe dist/vitals.exe
          # The same binary under its pre-rename name: Nexus agents (<= 0.2.5) only auto-update
          # from nexus.exe, so this is how they get Vitals. Keep it until no Nexus agents remain.
          # Do not add any other asset whose name contains "windows-x86_64" or starts with
          # "nexus-setup-": 0.2.5 agents would take it for their binary.
          Copy-Item agent/target/release/vitals.exe dist/nexus.exe
          Remove-Item installer/convex-url.txt
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: dist/*
          if-no-files-found: error

  linux:
    needs: versions
    name: linux (${{ matrix.arch }})
    strategy:
      matrix:
        include:
          - arch: x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - arch: aarch64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Install musl build tools
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends musl-tools
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: agent
          key: ${{ matrix.arch }}-musl
      - name: Build agent
        working-directory: agent
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package (.run installer + auto-update binaries)
        env:
          CONVEX_URL: ${{ secrets.CONVEX_URL }}
        run: |
          [ -n "$CONVEX_URL" ] || { echo "::error::Repository secret CONVEX_URL is not set"; exit 1; }
          printf '%s' "$CONVEX_URL" > installer/convex-url.txt
          mkdir -p dist && rm -f dist/*
          # Writes vitals-<v>-linux-<amd64|arm64>.run, vitals-linux-<arch>, nexus-linux-<arch>
          # (the name 0.2.5 agents look for) and vitals-uninstall.sh.
          sh installer/linux/make-run.sh ${{ matrix.arch }} agent/target/${{ matrix.target }}/release/vitals
          rm installer/convex-url.txt
          ls -l dist
      - uses: actions/upload-artifact@v4
        with:
          name: release-linux-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  android:
    needs: versions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Signing key from secret
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          [ -n "$KEYSTORE" ] || { echo "::error::Repository secret ANDROID_KEYSTORE_BASE64 is not set"; exit 1; }
          # Phones only accept an update signed with the key of the installed app.
          printf '%s' "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/vitals.keystore"
      - name: Test and build APK
        working-directory: android
        run: |
          chmod +x gradlew
          # Sign with that key by path: Gradle's default debug key location differs on the runner,
          # and a missing key is silently replaced by a new one that phones then reject.
          ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleDebug \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/vitals.keystore" \
            -Pandroid.injected.signing.store.password=android \
            -Pandroid.injected.signing.key.alias=androiddebugkey \
            -Pandroid.injected.signing.key.password=android
          rm "$RUNNER_TEMP/vitals.keystore"
          mkdir -p ../dist
          cp app/build/outputs/apk/debug/app-debug.apk "../dist/vitals-app-${{ needs.versions.outputs.version }}.apk"
      - name: APK is signed with the key of every earlier release
        run: |
          # SHA-256 of the signing certificate of every APK since the first (0.2.x).
          want=1b632788ab0bd6056e60b59849abc185c0ee75db6a3f8faeccc40fae33eb42f7
          # Newest build-tools that actually ships apksigner (a bare "newest folder" can lack it).
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          echo "using $apksigner"
          out=$("$apksigner" verify --verbose --print-certs dist/*.apk 2>&1) || { echo "$out"; echo "::error::apksigner could not verify the APK"; exit 1; }
          echo "$out"
          # Every distinct signer certificate, whatever label this apksigner version prints before it.
          got=$(printf '%s\n' "$out" | sed -n 's/.*certificate SHA-256 digest: *\([0-9a-fA-F]\{64\}\).*/\1/p' | tr 'A-F' 'a-f' | sort -u)
          echo "signer: $got"
          [ "$got" = "$want" ] || { echo "::error::APK signed with $got, not $want: phones would refuse the update. Check ANDROID_KEYSTORE_BASE64."; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: release-android
          path: dist/*
          if-no-files-found: error

  publish:
    needs: [versions, windows, linux, android]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.versions.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: One-line installers and release notes
        run: |
          # install.sh is what `curl -fsSL .../releases/latest/download/install.sh | sh` fetches.
          cp installer/linux/get.sh dist/install.sh
          cp installer/get.ps1 dist/install.ps1   # irm .../install.ps1 | iex
          sed "s/@VERSION@/$VERSION/g" installer/RELEASE_NOTES.md > "$RUNNER_TEMP/notes.md"

      - name: SHA256SUMS
        working-directory: dist
        run: |
          rm -f SHA256SUMS
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS

      # Everything is uploaded in one call, so agents never see a release with files missing.
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The release may already exist (a re-run, or one made by hand): fill it in, don't skip it.
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists; uploading the files to it."
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
            gh release edit "$GITHUB_REF_NAME" --draft=false --prerelease=false --latest               --notes-file "$RUNNER_TEMP/notes.md"
            exit 0
          fi
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "Vitals $GITHUB_REF_NAME" \
            --latest \
            --notes-file "$RUNNER_TEMP/notes.md"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Push the update to every device
        working-directory: convex
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
        run: |
          # Without the key, this step prints the command to run from a logged-in machine:
          #   cd convex && npx convex run --prod releases:publish '<args>'
          if [ -z "$CONVEX_DEPLOY_KEY" ]; then PUBLISH=0; else PUBLISH=1; fi
          npm ci --no-audit --no-fund
          apk="vitals-app-$VERSION.apk"
          sha=$(sed -n "s/^\([0-9a-f]\{64\}\)  $apk\$/\1/p" ../dist/SHA256SUMS)
          code=$(echo "$VERSION" | awk -F. '{ print $1 * 10000 + $2 * 100 + $3 }')
          args=$(printf '{"agentVersion":"%s","appVersion":"%s","appVersionCode":%s,"apkUrl":"https://github.com/%s/releases/download/%s/%s","apkSha256":"%s"}' \
            "$VERSION" "$VERSION" "$code" "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME" "$apk" "$sha")
          echo "$args"
          if [ "$PUBLISH" = 1 ]; then
            npx convex run releases:publish "$args"
          else
            echo "::warning::Not pushed. Run: cd convex && npx convex run --prod releases:publish '$args'"
          fi
